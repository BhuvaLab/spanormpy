[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanormpy"
dynamic = ["version"]
description = "Spatially-aware normalisation for spatial transcriptomics data (Python port of SpaNorm)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Dharmesh D. Bhuva", email = "dharmesh.bhuva@adelaide.edu.au" },
    { name = "Agus Salim", email = "salim.a@unimelb.edu.au" },
    { name = "Ahmed Mohamed", email = "mohamed.a@wehi.edu.au" },
]
keywords = ["spatial transcriptomics", "normalisation", "scverse", "anndata", "negative binomial", "SpaNorm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.3",
    "anndata>=0.10",
    "pandas",
    "python-igraph>=0.11",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/BhuvaLab/spanormpy"
Documentation = "https://bhuvalab.github.io/SpaNorm/"
Source = "https://github.com/BhuvaLab/spanormpy"
Issues = "https://github.com/BhuvaLab/spanormpy/issues"
Changelog = "https://github.com/BhuvaLab/spanormpy/blob/main/CHANGELOG.md"
"R package" = "https://github.com/BhuvaLab/SpaNorm"

[project.optional-dependencies]
spatial = ["spatialdata>=0.2"]
docs = ["sphinx", "myst-parser", "nbsphinx", "nbconvert", "ipykernel", "scanpy>=1.10", "squidpy"]
dev = ["pytest", "h5py", "threadpoolctl", "scikit-learn", "scanpy>=1.10", "ruff", "pre-commit"]

[tool.hatch.version]
path = "src/spanormpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spanormpy"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/ref/data", "tests/ref/Rlib", ".superpowers", "docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: test requires a CUDA device"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pinned so CI does not depend on the ruff version's default rule set
select = ["E4", "E7", "E9", "F", "I"]
# short names (O, I, lambdas) mirror the R/maths notation of the port
ignore = ["E731", "E741"]
