# Builds the sdist and wheel and publishes them to PyPI using trusted publishing (OIDC), so no
# API token is stored in GitHub. See docs/RELEASING.md for the one-time PyPI setup.
#
#   * push a tag `vX.Y.Z` matching `__version__`  -> build, check, publish to PyPI
#   * run manually (workflow_dispatch)            -> build, check, publish to TestPyPI
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python - <<'PY'
          import re, pathlib
          print(re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/spanormpy/__init__.py").read_text()).group(1))
          PY
          )
          test "v$pkg" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$pkg"; exit 1; }

      - name: Wheel installs and imports in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu dist/*.whl
          /tmp/clean/bin/python -c "import spanormpy; print(spanormpy.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
