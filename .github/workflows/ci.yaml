name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first, so the CUDA wheels are not pulled in)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,spatial]"

      - name: Lint
        run: ruff check src tests

      # Reference values are committed (tests/ref/data); no R or network access is needed.
      # Tests that compare against a ../SpaNorm checkout skip themselves when it is absent,
      # and GPU tests are skipped without CUDA.
      - name: Test
        run: pytest -q
